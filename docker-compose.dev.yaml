services:
  netflix-test:
    container_name: netflix-test
    image: node:22-alpine
    environment:
      # corepack 按 packageManager 字段下载 pnpm; 非交互容器关闭下载确认提示
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - 3011:3011
    working_dir: /app
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev"

  caddy:
    container_name: caddy
    restart: always
    ports:
      - 8080:8080
    image: caddy:alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
